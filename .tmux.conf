# change key binding to match screen
unbind C-b
bind C-a send-prefix
set -g prefix C-a

# tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'

# initialize tmux plugin manager (tpm)
run '~/.tmux/plugins/tpm/tpm'

set-option -g history-limit 200000

# Visual-only pane attention flag: agent hooks (Cursor/Claude Code) ring a
# bell in a pane to flag its window in the status bar (monitor-bell is on by
# default). Suppress forwarding that bell up to the outer terminal so it
# stays a silent, in-tmux visual cue instead of an audible ding.
set -g bell-action none

# shortcut: `:cwd /path/to/dir` to change session default directory
set -s command-alias[10] cwd='attach-session -t . -c'
